<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Petal & Bloom · cute flower shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff5f9;
      background-image: radial-gradient(circle at 10% 20%, rgba(255, 210, 225, 0.5) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(210, 180, 255, 0.4) 0%, transparent 40%),
                        radial-gradient(circle at 30% 80%, rgba(200, 240, 220, 0.5) 0%, transparent 35%);
      font-family: 'Quicksand', sans-serif;
      color: #4f2e3f;
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem;
      position: relative;
      overflow-x: hidden;
    }

    /* floating petals animation */
    .petal-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.3;
      animation: floatPetal linear infinite;
      user-select: none;
    }

    @keyframes floatPetal {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0.2; }
      20% { opacity: 0.45; }
      80% { opacity: 0.45; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    /* main container */
    .shop-wrapper {
      max-width: 1300px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* header */
    .shop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff7b9c, #c96eff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
      filter: drop-shadow(0 6px 12px rgba(255, 120, 160, 0.3));
    }

    .logo span {
      font-size: 2.2rem;
      transform: rotate(10deg);
      display: inline-block;
      animation: wiggle 6s infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(8deg) scale(1); }
      50% { transform: rotate(18deg) scale(1.1); }
    }

    .cute-badge {
      background: #ffe2ec;
      padding: 0.6rem 1.2rem;
      border-radius: 100px;
      font-weight: 600;
      color: #b14e7a;
      font-size: 0.9rem;
      border: 2px dashed #ffb6cf;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(255, 143, 177, 0.2);
    }

    /* tagline */
    .tagline {
      font-family: 'Caveat', cursive;
      font-size: 1.7rem;
      color: #b07a96;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .tagline::before {
      content: "🌸";
      font-size: 2rem;
      animation: twinkle 2s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15) rotate(5deg); }
    }

    /* product grid */
    .flower-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.8rem;
    }

    /* flower card */
    .flower-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 36px;
      padding: 1.5rem 1rem 1.2rem;
      text-align: center;
      border: 3px solid #ffffff;
      box-shadow: 0 18px 30px -12px rgba(255, 130, 170, 0.3), 0 0 0 2px #ffe2ec inset;
      transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .flower-card::after {
      content: "✨";
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 1.2rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      transform: scale(0.6);
    }

    .flower-card:hover::after {
      opacity: 0.9;
      transform: scale(1) rotate(10deg);
    }

    .flower-card:hover {
      transform: translateY(-8px) rotate(-1deg);
      box-shadow: 0 26px 40px -14px #ff98bb, 0 0 0 3px #ffd0e0 inset;
      border-color: #ffeef4;
    }

    .flower-emoji {
      font-size: 4.5rem;
      line-height: 1.2;
      filter: drop-shadow(0 12px 12px rgba(255, 143, 177, 0.4));
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      margin-bottom: 0.5rem;
      display: inline-block;
      animation: bob 4s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    .flower-card:hover .flower-emoji {
      transform: scale(1.15) rotate(6deg);
      animation: none;
    }

    .flower-name {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: #632e48;
      margin: 0.5rem 0 0.2rem;
      letter-spacing: -0.01em;
    }

    .flower-price {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: #ff6f9c;
      background: #ffeaf2;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      display: inline-block;
      margin: 0.6rem 0 0.2rem;
    }

    .flower-price::before {
      content: "$";
      font-size: 0.9rem;
      margin-right: 2px;
      opacity: 0.8;
    }

    .tap-hint {
      font-size: 0.75rem;
      color: #bb8aa3;
      margin-top: 0.5rem;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0.9;
    }

    /* MODAL overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 230, 240, 0.7);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #fffafd;
      max-width: 480px;
      width: 100%;
      border-radius: 48px;
      padding: 2rem 2rem 2rem;
      box-shadow: 0 40px 60px -20px #e68eb0, 0 0 0 4px #ffffff, 0 0 0 6px #ffd9e6;
      text-align: center;
      position: relative;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.2, 1.1, 0.4, 1), opacity 0.3s;
      opacity: 0;
      border: 2px solid #ffe2ec;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .close-modal {
      position: absolute;
      top: 1.2rem;
      right: 1.5rem;
      background: #ffe4ef;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.6rem;
      line-height: 1;
      color: #b35981;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 4px 8px rgba(255, 143, 177, 0.3);
      font-weight: 400;
    }

    .close-modal:hover {
      background: #ffb0cb;
      color: white;
      transform: rotate(90deg) scale(1.05);
    }

    .modal-emoji {
      font-size: 6rem;
      filter: drop-shadow(0 16px 16px rgba(255, 143, 177, 0.5));
      margin-bottom: 0.5rem;
      display: inline-block;
      animation: popIn 0.5s cubic-bezier(0.2, 1.2, 0.5, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.5) rotate(-15deg); opacity: 0; }
      80% { transform: scale(1.1) rotate(5deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .modal-name {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #511f36;
      margin: 0.2rem 0 0.3rem;
      letter-spacing: -0.02em;
    }

    .modal-desc {
      font-size: 1rem;
      color: #a06f87;
      margin: 0.8rem 0 1.2rem;
      line-height: 1.6;
      font-weight: 500;
      padding: 0 0.5rem;
      background: #fff3f8;
      padding: 1rem 1.2rem;
      border-radius: 30px;
      border: 2px dashed #ffc1d6;
    }

    .modal-price {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #ff6b9d;
      background: #ffecf3;
      padding: 0.3rem 1.8rem;
      border-radius: 60px;
      display: inline-block;
      margin-bottom: 1.5rem;
      border: 2px solid #ffb7d0;
    }

    .modal-price::before {
      content: "$";
      font-size: 1.2rem;
      margin-right: 4px;
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px -6px rgba(255, 143, 177, 0.5);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff8fb1, #c98fff);
      color: white;
      box-shadow: 0 10px 20px -8px #c96eff;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 26px -8px #c96eff;
      filter: brightness(1.05);
    }

    .btn-secondary {
      background: white;
      color: #b35981;
      border: 2px solid #ffc1d6;
      box-shadow: 0 4px 10px -4px #ffb7d0;
    }

    .btn-secondary:hover {
      background: #fff0f6;
      transform: translateY(-3px);
      border-color: #ff9bbc;
    }

    /* toast */
    .toast-msg {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: #4f2e3f;
      color: #ffeef4;
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 16px 30px -8px #4f2e3f;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 2000;
      border: 2px solid #ffc1d6;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* empty / footer */
    .footer-note {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.9rem;
      color: #c99bb3;
      font-weight: 500;
      background: #fff1f7;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      padding: 0.5rem 1.8rem;
      border-radius: 60px;
      border: 2px dashed #ffc1d6;
    }

    @media (max-width: 500px) {
      .flower-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
      .flower-emoji { font-size: 3.2rem; }
      .flower-name { font-size: 1rem; }
      .modal-card { padding: 1.5rem; }
      .modal-name { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- floating petals -->
  <div class="petal-bg" id="petalBg"></div>

  <div class="shop-wrapper">
    <header class="shop-header">
      <div class="logo">
        <span>🌸</span> Petal & Bloom
      </div>
      <div class="cute-badge">
        <span>🌷</span> Free delivery over $25
      </div>
    </header>

    <div class="tagline">
      pick a little joy — tap any flower for details
    </div>

    <!-- product grid will be filled by js -->
    <div class="flower-grid" id="flowerGrid"></div>

    <div class="footer-note">
      🌼 handpicked with love · fresh from the garden 🌼
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <button class="close-modal" id="closeModalBtn" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast-msg" id="toastMsg">🌸 added to basket</div>

  <script>
    (function() {
      // ------- flower data (cute products) -------
      const flowers = [
        { id: 'f1', emoji: '🌸', name: 'Cherry Blossom', price: 18.50, desc: 'Delicate pink petals that whisper spring. Perfect for a gentle soul.' },
        { id: 'f2', emoji: '🌷', name: 'Tulip Dream', price: 14.90, desc: 'Buttercup yellow tulips — a pocketful of sunshine.' },
        { id: 'f3', emoji: '🌼', name: 'Daisy Chain', price: 12.00, desc: 'Cheerful daisies to brighten any room. Simple and sweet.' },
        { id: 'f4', emoji: '🌺', name: 'Hibiscus Glow', price: 22.30, desc: 'Tropical vibes with a vivid coral bloom. Instant holiday mood.' },
        { id: 'f5', emoji: '🌻', name: 'Sunny Sunflower', price: 16.80, desc: 'A big smile in flower form. Follows the light all day.' },
        { id: 'f6', emoji: '🌹', name: 'Velvet Rose', price: 24.00, desc: 'Classic romance with a soft, powdery scent. Pure elegance.' },
        { id: 'f7', emoji: '💮', name: 'White Blossom', price: 19.20, desc: 'Peaceful and pure — like a quiet morning in the garden.' },
        { id: 'f8', emoji: '🏵️', name: 'Rosette Charm', price: 21.50, desc: 'A little rosette that looks like a ribbon. Vintage cute.' },
        { id: 'f9', emoji: '🌿', name: 'Eucalyptus Hug', price: 15.40, desc: 'Soft green sprigs — calming and fresh. Great for any bouquet.' },
        { id: 'f10', emoji: '🌸', name: 'Pink Petal Mix', price: 27.90, desc: 'A handful of pink happiness: cherry, peony, and carnation notes.' }
      ];

      // ------- DOM elements -------
      const grid = document.getElementById('flowerGrid');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalContent = document.getElementById('modalContent');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const toast = document.getElementById('toastMsg');

      let toastTimer = null;

      // ------- render flower cards -------
      function renderFlowers() {
        grid.innerHTML = flowers.map((flower, index) => {
          // stagger animation delay a bit for cuteness
          const delay = (index * 0.05).toFixed(2);
          return `
            <div class="flower-card" data-id="${flower.id}" style="animation: cardFade 0.5s ${delay}s both;">
              <div class="flower-emoji">${flower.emoji}</div>
              <div class="flower-name">${flower.name}</div>
              <div class="flower-price">${flower.price.toFixed(2)}</div>
              <div class="tap-hint">🌸 tap for details</div>
            </div>
          `;
        }).join('');
      }

      // add a tiny fade keyframe for cards via style injection (or we can rely on existing)
      // but we already have bob animation, so we add a quick fadeIn
      const styleSheet = document.createElement("style");
      styleSheet.textContent = `
        @keyframes cardFade {
          from { opacity: 0; transform: translateY(20px) scale(0.95); }
          to { opacity: 1; transform: translateY(0) scale(1); }
        }
      `;
      document.head.appendChild(styleSheet);

      // ------- open modal with flower details -------
      function openModal(flowerId) {
        const flower = flowers.find(f => f.id === flowerId);
        if (!flower) return;

        // Build modal content
        modalContent.innerHTML = `
          <div class="modal-emoji">${flower.emoji}</div>
          <div class="modal-name">${flower.name}</div>
          <div class="modal-price">${flower.price.toFixed(2)}</div>
          <div class="modal-desc">${flower.desc}</div>
          <div class="modal-actions">
            <button class="btn btn-primary" id="modalAddBtn" data-id="${flower.id}">🌸 add to basket</button>
            <button class="btn btn-secondary" id="modalCloseBtn">maybe later</button>
          </div>
        `;

        // Activate modal with a tiny pop
        modalOverlay.classList.add('active');

        // attach event listeners inside modal
        const addBtn = document.getElementById('modalAddBtn');
        const closeBtn = document.getElementById('modalCloseBtn');

        if (addBtn) {
          addBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showToast(`🌸 ${flower.name} added to your basket!`);
            // cute pulse on card? not needed
            closeModal(); // optionally close after add? we keep modal open? but user wants feedback; let's close after small delay? 
            // We'll keep it open but maybe show toast. For better UX, let's close modal after 0.2s? no, many like to stay.
            // Instead, we can leave it open and let user close manually. We'll show toast.
            // But we also can close to feel snappy. I'll close after a short delay, but keep toast.
            // Actually let's close immediately but show toast — good flow.
            // But the user might want to add multiple? We'll close for simplicity but show toast.
            // Better: close modal after adding (so they can continue shopping). We'll do that.
            closeModal();
            showToast(`🌸 ${flower.name} added to basket!`);
          });
        }

        if (closeBtn) {
          closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeModal();
          });
        }
      }

      // ------- close modal -------
      function closeModal() {
        modalOverlay.classList.remove('active');
        // optional: clear content after transition to avoid flicker
        setTimeout(() => {
          if (!modalOverlay.classList.contains('active')) {
            // we don't need to clear but fine
          }
        }, 300);
      }

      // ------- toast helper -------
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2200);
      }

      // ------- event delegation on grid (open modal) -------
      grid.addEventListener('click', (e) => {
        const card = e.target.closest('.flower-card');
        if (!card) return;
        const id = card.dataset.id;
        openModal(id);
      });

      // close modal if clicking overlay background or close button
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
          closeModal();
        }
      });

      // also close with escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
          closeModal();
        }
      });

      // ensure that clicking inside modal card doesn't close (we already stop via target check)
      // but we need to prevent clicks on card from bubbling to overlay? no, target check handles it.

      // ------- floating petals background -------
      function createFloatingPetals() {
        const container = document.getElementById('petalBg');
        const petalEmojis = ['🌸', '🌷', '🌼', '🌺', '💮', '🌿', '🏵️', '🌹'];
        const PETAL_COUNT = 18;

        for (let i = 0; i < PETAL_COUNT; i++) {
          const petal = document.createElement('div');
          petal.className = 'petal';
          petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
          petal.style.left = Math.random() * 100 + '%';
          petal.style.fontSize = (1.2 + Math.random() * 2) + 'rem';
          petal.style.animationDuration = (12 + Math.random() * 18) + 's';
          petal.style.animationDelay = (Math.random() * -20) + 's';
          petal.style.opacity = 0.2 + Math.random() * 0.3;
          container.appendChild(petal);
        }
      }

      // ------- init -------
      renderFlowers();
      createFloatingPetals();

      // ensure modal starts closed
      modalOverlay.classList.remove('active');
    })();
  </script>
</body>
</html>
