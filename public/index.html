<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodExpress · Order Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
    :root {
        --bg:        #0a0a0f;
        --bg-soft:   #12121a;
        --surface:   #16161f;
        --surface-2: #1e1e2b;
        --border:    #2a2a3a;
        --text:      #f1f5f9;
        --text-dim:  #8b93a7;
        --brand:     #22c55e;
        --brand-2:   #facc15;
        --accent:    #f97316;
        --danger:    #ef4444;
        --radius:    14px;
        --radius-sm: 8px;
        --shadow:    0 20px 40px -12px rgba(0,0,0,.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(1000px 600px at 10% -10%, rgba(34,197,94,.15), transparent 60%),
            radial-gradient(900px 500px at 110% 10%, rgba(249,115,22,.15), transparent 60%);
        pointer-events: none;
        z-index: 0;
    }

    /* Header */
    header {
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(14px);
        background: rgba(10,10,15,.75);
        border-bottom: 1px solid var(--border);
    }
    .header-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }
    .logo {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.75rem;
        letter-spacing: .08em;
        background: linear-gradient(90deg, var(--brand), var(--brand-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: .5rem;
    }
    .logo span:last-child { font-size: 1.1rem; }
    nav { display: flex; gap: .5rem; align-items: center; }
    .nav-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: .5rem 1rem;
        border-radius: 999px;
        font-size: .875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all .2s;
        font-family: inherit;
        position: relative;
    }
    .nav-btn:hover { color: var(--text); border-color: var(--accent); }
    .nav-btn.active {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
    }
    .cart-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--accent);
        color: #fff;
        font-size: .7rem;
        font-weight: 700;
        min-width: 20px;
        height: 20px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        border: 2px solid var(--bg);
    }

    /* Main */
    main {
        position: relative;
        z-index: 1;
        max-width: 1280px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 4rem;
    }

    .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
    }
    .page-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: .04em;
        line-height: 1;
    }
    .page-subtitle { color: var(--text-dim); margin-top: .5rem; font-size: .95rem; }

    /* Category tabs */
    .category-tabs {
        display: flex;
        gap: .5rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
    }
    .cat-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: .45rem 1rem;
        border-radius: 999px;
        font-size: .82rem;
        font-weight: 500;
        cursor: pointer;
        transition: all .2s;
        font-family: inherit;
    }
    .cat-btn:hover { color: var(--text); border-color: var(--accent); }
    .cat-btn.active {
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: #0a0a0f;
        border-color: transparent;
        font-weight: 700;
    }

    /* Layout */
    .shop-layout {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 2rem;
        align-items: start;
    }
    @media (max-width: 960px) {
        .shop-layout { grid-template-columns: 1fr; }
        .cart-panel { position: static !important; }
    }

    /* Menu grid */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 1.25rem;
    }
    .food-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;
        display: flex;
        flex-direction: column;
    }
    .food-card:hover {
        transform: translateY(-6px);
        border-color: var(--accent);
        box-shadow: var(--shadow);
    }
    .food-visual {
        aspect-ratio: 4 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        position: relative;
        overflow: hidden;
    }
    .food-visual::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(10,10,15,.85), transparent 60%);
    }
    .food-visual .emoji {
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,.5));
        transition: transform .4s;
    }
    .food-card:hover .food-visual .emoji { transform: scale(1.15) rotate(-5deg); }

    .cat-badge {
        position: absolute;
        top: .75rem;
        left: .75rem;
        background: rgba(0,0,0,.6);
        backdrop-filter: blur(8px);
        padding: .25rem .6rem;
        border-radius: 999px;
        font-size: .7rem;
        font-weight: 700;
        letter-spacing: .05em;
        z-index: 2;
        border: 1px solid rgba(255,255,255,.15);
        text-transform: uppercase;
    }

    .food-info { padding: 1rem 1.1rem 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .food-info h3 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: .25rem;
        letter-spacing: -.01em;
    }
    .food-desc {
        font-size: .8rem;
        color: var(--text-dim);
        margin-bottom: .9rem;
        flex: 1;
    }
    .food-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .5rem;
    }
    .price {
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--brand-2);
        font-family: 'Bebas Neue', sans-serif;
        letter-spacing: .03em;
    }

    /* Buttons */
    .btn {
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: #0a0a0f;
        border: none;
        padding: .6rem 1.1rem;
        border-radius: 999px;
        font-weight: 700;
        font-size: .85rem;
        cursor: pointer;
        transition: transform .15s, box-shadow .2s, opacity .2s;
        display: inline-flex;
        align-items: center;
        gap: .4rem;
        font-family: inherit;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -6px rgba(34,197,94,.6); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn.ghost {
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--border);
    }
    .btn.ghost:hover { color: var(--text); border-color: var(--accent); box-shadow: none; }
    .btn.block { width: 100%; justify-content: center; }
    .btn.danger { background: var(--danger); color: #fff; }
    .btn.danger:hover { box-shadow: 0 8px 20px -6px rgba(239,68,68,.6); }

    /* Cart panel */
    .cart-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        position: sticky;
        top: 5.5rem;
    }
    .cart-panel h2 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.5rem;
        letter-spacing: .04em;
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: .5rem;
    }

    .cart-empty {
        text-align: center;
        padding: 2rem 1rem;
        color: var(--text-dim);
    }
    .cart-empty .icon { font-size: 2.5rem; margin-bottom: .75rem; opacity: .4; }

    .cart-item {
        display: flex;
        align-items: center;
        gap: .75rem;
        padding: .75rem 0;
        border-bottom: 1px dashed var(--border);
    }
    .cart-item:last-of-type { border-bottom: none; }
    .cart-item-emoji {
        font-size: 1.75rem;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-2);
        border-radius: 10px;
        flex-shrink: 0;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
        font-size: .875rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .cart-item-price {
        font-size: .78rem;
        color: var(--text-dim);
        margin-top: .1rem;
    }
    .qty-controls {
        display: flex;
        align-items: center;
        gap: .25rem;
        background: var(--surface-2);
        border-radius: 999px;
        padding: .15rem;
    }
    .qty-btn {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .15s;
        font-family: inherit;
    }
    .qty-btn:hover { background: var(--border); }
    .qty-value {
        min-width: 20px;
        text-align: center;
        font-size: .85rem;
        font-weight: 700;
    }

    .cart-summary {
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
    }
    .summary-row {
        display: flex;
        justify-content: space-between;
        font-size: .875rem;
        padding: .35rem 0;
        color: var(--text-dim);
    }
    .summary-row strong { color: var(--text); }
    .summary-row.free strong { color: var(--brand); }
    .summary-total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
    }
    .summary-total .label {
        font-size: .8rem;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--text-dim);
    }
    .summary-total .amount {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 2rem;
        letter-spacing: .03em;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    /* Checkout form */
    .checkout-view { max-width: 1000px; margin: 0 auto; }
    .checkout-layout {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 2rem;
        align-items: start;
    }
    @media (max-width: 820px) {
        .checkout-layout { grid-template-columns: 1fr; }
    }

    .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.75rem;
    }
    .panel h2 {
        font-size: 1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--text-dim);
        margin-bottom: 1.25rem;
    }

    .field { margin-bottom: 1rem; }
    .field label {
        display: block;
        font-size: .78rem;
        color: var(--text-dim);
        margin-bottom: .4rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: .05em;
    }
    .field input,
    .field textarea {
        width: 100%;
        padding: .75rem .9rem;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: .95rem;
        font-family: inherit;
        transition: border-color .2s, box-shadow .2s;
        resize: vertical;
    }
    .field textarea { min-height: 80px; }
    .field input:focus,
    .field textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(249,115,22,.15);
    }

    /* Confirmation */
    .confirm-wrap {
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
    }
    .confirm-icon {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.25rem;
        margin: 0 auto 1.5rem;
        box-shadow: 0 0 40px -5px rgba(34,197,94,.6);
        animation: pop .5s cubic-bezier(.2,1.4,.5,1);
    }
    @keyframes pop {
        0%   { transform: scale(.3); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .receipt {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.75rem;
        text-align: left;
        position: relative;
        overflow: hidden;
    }
    .receipt::before, .receipt::after {
        content: "";
        position: absolute;
        width: 22px; height: 22px;
        background: var(--bg);
        border-radius: 50%;
        top: 50%;
        transform: translateY(-50%);
        border: 1px solid var(--border);
    }
    .receipt::before { left: -12px; border-right: none; }
    .receipt::after  { right: -12px; border-left: none; }

    .receipt-id {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.6rem;
        letter-spacing: .15em;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-align: center;
        margin-bottom: .25rem;
    }
    .receipt-id-label {
        text-align: center;
        font-size: .7rem;
        letter-spacing: .3em;
        color: var(--text-dim);
        text-transform: uppercase;
        margin-bottom: 1.5rem;
    }

    .receipt-items {
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px dashed var(--border);
    }
    .receipt-line {
        display: flex;
        justify-content: space-between;
        font-size: .875rem;
        padding: .3rem 0;
    }
    .receipt-line .name { color: var(--text-dim); }
    .receipt-line .name strong { color: var(--text); margin-right: .3rem; }

    .receipt-row {
        display: flex;
        justify-content: space-between;
        padding: .5rem 0;
        font-size: .9rem;
    }
    .receipt-row .k { color: var(--text-dim); }
    .receipt-row .v { font-weight: 600; text-align: right; }
    .receipt-row.total {
        padding-top: .75rem;
        margin-top: .5rem;
        border-top: 1px solid var(--border);
        font-size: 1.05rem;
    }
    .receipt-row.total .v { color: var(--brand-2); font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: .03em; }

    /* Orders list */
    .orders-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.25rem;
    }
    .order-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem;
        transition: border-color .2s, transform .2s;
    }
    .order-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .order-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: .75rem;
        padding-bottom: .75rem;
        border-bottom: 1px solid var(--border);
    }
    .order-id {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.2rem;
        letter-spacing: .1em;
        color: var(--brand-2);
    }
    .status-pill {
        background: rgba(34,197,94,.15);
        color: var(--brand);
        border: 1px solid rgba(34,197,94,.3);
        padding: .2rem .6rem;
        border-radius: 999px;
        font-size: .7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
    }
    .order-meta {
        font-size: .82rem;
        color: var(--text-dim);
        margin-bottom: .35rem;
    }
    .order-items-list {
        font-size: .82rem;
        color: var(--text-dim);
        margin: .5rem 0 .75rem;
        line-height: 1.6;
    }
    .order-total {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.5rem;
        letter-spacing: .03em;
        color: var(--brand-2);
    }

    /* Misc */
    .hidden { display: none !important; }

    .toast-area {
        position: fixed;
        top: 5rem;
        right: 1.5rem;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: .5rem;
    }
    .toast {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-left: 3px solid var(--danger);
        padding: .85rem 1.1rem;
        border-radius: var(--radius-sm);
        font-size: .875rem;
        box-shadow: var(--shadow);
        animation: slideIn .25s ease-out;
        max-width: 320px;
    }
    .toast.success { border-left-color: var(--brand); }
    @keyframes slideIn {
        from { transform: translateX(20px); opacity: 0; }
        to   { transform: translateX(0);    opacity: 1; }
    }

    .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-dim);
    }
    .empty .icon { font-size: 3rem; margin-bottom: 1rem; opacity: .4; }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: .4rem;
        color: var(--text-dim);
        font-size: .875rem;
        cursor: pointer;
        margin-bottom: 1rem;
        transition: color .2s;
        background: none;
        border: none;
        font-family: inherit;
    }
    .back-link:hover { color: var(--accent); }
</style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo" onclick="goHome()">
            <span>FOODEXPRESS</span><span>🍔</span>
        </div>
        <nav>
            <button class="nav-btn active" id="nav-menu" onclick="goHome()">Menu</button>
            <button class="nav-btn" id="nav-orders" onclick="showOrders()">My Orders</button>
            <button class="nav-btn" id="nav-cart" onclick="scrollToCart()">
                🛒 Cart
                <span class="cart-badge hidden" id="cart-badge">0</span>
            </button>
        </nav>
    </div>
</header>

<main>
    <div class="toast-area" id="toast-area"></div>

    <!-- ============ MENU ============ -->
    <section id="view-menu">
        <div class="page-head">
            <div>
                <h1 class="page-title">Today's Menu</h1>
                <p class="page-subtitle">Fresh food delivered to your door.</p>
            </div>
        </div>

        <div class="category-tabs" id="category-tabs"></div>

        <div class="shop-layout">
            <div class="menu-grid" id="menu-grid">Loading…</div>

            <aside class="cart-panel" id="cart-panel">
                <h2>🛒 Your Cart</h2>
                <div id="cart-content"></div>
            </aside>
        </div>
    </section>

    <!-- ============ CHECKOUT ============ -->
    <section id="view-checkout" class="hidden">
        <div class="checkout-view">
            <button class="back-link" onclick="goHome()">← Back to menu</button>

            <div class="page-head">
                <div>
                    <h1 class="page-title">Checkout</h1>
                    <p class="page-subtitle">Almost there — just a few details.</p>
                </div>
            </div>

            <div class="checkout-layout">
                <div class="panel">
                    <h2>Delivery details</h2>
                    <div class="field">
                        <label for="name">Full name</label>
                        <input type="text" id="name" placeholder="Jane Doe" autocomplete="name">
                    </div>
                    <div class="field">
                        <label for="phone">Phone number</label>
                        <input type="tel" id="phone" placeholder="+1 555 123 4567" autocomplete="tel">
                    </div>
                    <div class="field">
                        <label for="address">Delivery address</label>
                        <textarea id="address" placeholder="123 Main St, Apt 4B, Springfield"></textarea>
                    </div>
                    <div class="field">
                        <label for="notes">Notes (optional)</label>
                        <textarea id="notes" placeholder="Ring the bell twice, leave at the door…"></textarea>
                    </div>
                </div>

                <div class="panel">
                    <h2>Order summary</h2>
                    <div id="checkout-summary"></div>
                    <button class="btn block" id="place-order-btn" onclick="placeOrder()" style="margin-top:1.25rem;">
                        Place Order →
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- ============ CONFIRMATION ============ -->
    <section id="view-confirmation" class="hidden">
        <div class="confirm-wrap">
            <div class="confirm-icon">✓</div>
            <h1 class="page-title">Order Confirmed!</h1>
            <p class="page-subtitle" style="margin-bottom:1.75rem;">
                Your food is being prepared. It'll arrive soon 🛵
            </p>

            <div class="receipt" id="receipt-card"></div>

            <div style="margin-top:1.75rem;display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;">
                <button class="btn" onclick="goHome()">Order More</button>
                <button class="btn ghost" onclick="showOrders()">View All Orders</button>
            </div>
        </div>
    </section>

    <!-- ============ ORDERS ============ -->
    <section id="view-orders" class="hidden">
        <button class="back-link" onclick="goHome()">← Back to menu</button>
        <div class="page-head">
            <div>
                <h1 class="page-title">My Orders</h1>
                <p class="page-subtitle">All your past orders.</p>
            </div>
        </div>
        <div class="orders-grid" id="orders-grid"></div>
    </section>
</main>

<script>
// ============================================================
// STATE
// ============================================================
const state = {
    menu: [],
    cart: new Map(),        // id -> qty
    activeCategory: "All",
    lastOrder: null,
};

const $ = (id) => document.getElementById(id);

// ============================================================
// HELPERS
// ============================================================
function show(viewId) {
    ["view-menu","view-checkout","view-confirmation","view-orders"]
        .forEach(v => $(v).classList.toggle("hidden", v !== viewId));
    const activeNav = viewId === "view-orders" ? "nav-orders" : "nav-menu";
    $("nav-menu").classList.toggle("active", activeNav === "nav-menu");
    $("nav-orders").classList.toggle("active", activeNav === "nav-orders");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function toast(msg, type = "error") {
    const area = $("toast-area");
    const el = document.createElement("div");
    el.className = "toast " + (type === "success" ? "success" : "");
    el.textContent = msg;
    area.appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

async function api(url, options) {
    const res = await fetch(url, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
}

// ============================================================
// MENU VIEW
// ============================================================
async function goHome() {
    try {
        state.menu = await api("/api/menu");
        renderCategories();
        renderMenu();
        renderCart();
        show("view-menu");
    } catch (e) {
        toast(e.message);
    }
}

function renderCategories() {
    const cats = ["All", ...new Set(state.menu.map(m => m.category))];
    $("category-tabs").innerHTML = cats.map(c => `
        <button class="cat-btn ${c === state.activeCategory ? "active" : ""}"
                onclick="setCategory('${c}')">${c}</button>
    `).join("");
}

function setCategory(cat) {
    state.activeCategory = cat;
    renderCategories();
    renderMenu();
}

function renderMenu() {
    const items = state.activeCategory === "All"
        ? state.menu
        : state.menu.filter(m => m.category === state.activeCategory);

    $("menu-grid").innerHTML = items.map(m => `
        <div class="food-card">
            <div class="food-visual" style="background: linear-gradient(135deg, ${m.color}40, ${m.color}05);">
                <span class="cat-badge">${m.category}</span>
                <span class="emoji">${m.emoji}</span>
            </div>
            <div class="food-info">
                <h3>${m.name}</h3>
                <p class="food-desc">${m.desc}</p>
                <div class="food-footer">
                    <span class="price">$${m.price.toFixed(2)}</span>
                    <button class="btn" onclick="addToCart('${m.id}')">+ Add</button>
                </div>
            </div>
        </div>
    `).join("");
}

// ============================================================
// CART
// ============================================================
function addToCart(id) {
    const current = state.cart.get(id) || 0;
    state.cart.set(id, current + 1);
    renderCart();
    const item = state.menu.find(m => m.id === id);
    toast(`Added ${item.name} to cart`, "success");
}

function changeQty(id, delta) {
    const current = state.cart.get(id) || 0;
    const next = current + delta;
    if (next <= 0) state.cart.delete(id);
    else state.cart.set(id, next);
    renderCart();
}

function clearCart() {
    state.cart.clear();
    renderCart();
    toast("Cart cleared");
}

function getCartDetails() {
    const items = [];
    let subtotal = 0;
    for (const [id, qty] of state.cart.entries()) {
        const m = state.menu.find(x => x.id === id);
        if (!m) continue;
        const lineTotal = +(m.price * qty).toFixed(2);
        subtotal += lineTotal;
        items.push({ ...m, qty, lineTotal });
    }
    const deliveryFee = subtotal > 25 ? 0 : (subtotal > 0 ? 2.99 : 0);
    const tax = +(subtotal * 0.08).toFixed(2);
    const total = +(subtotal + deliveryFee + tax).toFixed(2);
    return { items, subtotal: +subtotal.toFixed(2), deliveryFee, tax, total };
}

function renderCart() {
    const content = $("cart-content");
    const { items, subtotal, deliveryFee, tax, total } = getCartDetails();
    const totalQty = items.reduce((s, i) => s + i.qty, 0);

    // Nav badge
    const badge = $("cart-badge");
    if (totalQty > 0) {
        badge.textContent = totalQty;
        badge.classList.remove("hidden");
    } else {
        badge.classList.add("hidden");
    }

    if (items.length === 0) {
        content.innerHTML = `
            <div class="cart-empty">
                <div class="icon">🛒</div>
                <p>Your cart is empty.</p>
                <p class="muted" style="font-size:.8rem;margin-top:.5rem;">Add something delicious!</p>
            </div>`;
        return;
    }

    content.innerHTML = `
        ${items.map(it => `
            <div class="cart-item">
                <div class="cart-item-emoji">${it.emoji}</div>
                <div class="cart-item-info">
                    <div class="cart-item-name">${it.name}</div>
                    <div class="cart-item-price">$${it.price.toFixed(2)} each</div>
                </div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="changeQty('${it.id}', -1)">−</button>
                    <span class="qty-value">${it.qty}</span>
                    <button class="qty-btn" onclick="changeQty('${it.id}', 1)">+</button>
                </div>
            </div>
        `).join("")}

        <div class="cart-summary">
            <div class="summary-row"><span>Subtotal</span><strong>$${subtotal.toFixed(2)}</strong></div>
            <div class="summary-row ${deliveryFee === 0 ? "free" : ""}">
                <span>Delivery</span>
                <strong>${deliveryFee === 0 ? "FREE" : "$" + deliveryFee.toFixed(2)}</strong>
            </div>
            <div class="summary-row"><span>Tax (8%)</span><strong>$${tax.toFixed(2)}</strong></div>
            <div class="summary-total">
                <span class="label">Total</span>
                <span class="amount">$${total.toFixed(2)}</span>
            </div>
            ${deliveryFee > 0 ? `<p class="muted" style="font-size:.75rem;margin-top:.5rem;text-align:center;">Add $${(25 - subtotal).toFixed(2)} more for free delivery</p>` : ""}
        </div>

        <div style="display:flex;gap:.5rem;margin-top:1.25rem;">
            <button class="btn ghost" onclick="clearCart()" style="flex:1;justify-content:center;">Clear</button>
            <button class="btn" onclick="goToCheckout()" style="flex:2;justify-content:center;">Checkout →</button>
        </div>
    `;
}

function scrollToCart() {
    const panel = $("cart-panel");
    if (panel) panel.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ============================================================
// CHECKOUT
// ============================================================
function goToCheckout() {
    if (state.cart.size === 0) return toast("Your cart is empty");
    renderCheckoutSummary();
    show("view-checkout");
}

function renderCheckoutSummary() {
    const { items, subtotal, deliveryFee, tax, total } = getCartDetails();
    $("checkout-summary").innerHTML = `
        <div class="receipt-items">
            ${items.map(it => `
                <div class="receipt-line">
                    <span class="name"><strong>${it.qty}×</strong> ${it.emoji} ${it.name}</span>
                    <span>$${it.lineTotal.toFixed(2)}</span>
                </div>
            `).join("")}
        </div>
        <div class="summary-row"><span>Subtotal</span><strong>$${subtotal.toFixed(2)}</strong></div>
        <div class="summary-row ${deliveryFee === 0 ? "free" : ""}">
            <span>Delivery</span>
            <strong>${deliveryFee === 0 ? "FREE" : "$" + deliveryFee.toFixed(2)}</strong>
        </div>
        <div class="summary-row"><span>Tax (8%)</span><strong>$${tax.toFixed(2)}</strong></div>
        <div class="summary-total">
            <span class="label">Total</span>
            <span class="amount">$${total.toFixed(2)}</span>
        </div>
    `;
}

async function placeOrder() {
    const name = $("name").value.trim();
    const phone = $("phone").value.trim();
    const address = $("address").value.trim();
    const notes = $("notes").value.trim();

    if (!name) return toast("Please enter your name");
    if (!phone || phone.length < 5) return toast("Please enter a valid phone number");
    if (!address) return toast("Please enter your delivery address");

    const items = [...state.cart.entries()].map(([id, qty]) => ({ id, qty }));

    $("place-order-btn").disabled = true;
    try {
        const order = await api("/api/order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items, name, address, phone, notes }),
        });

        state.lastOrder = order;
        state.cart.clear();
        renderCart();
        $("name").value = "";
        $("phone").value = "";
        $("address").value = "";
        $("notes").value = "";

        renderReceipt(order);
        toast("Order placed! 🎉", "success");
        show("view-confirmation");
    } catch (e) {
        toast(e.message);
    } finally {
        $("place-order-btn").disabled = false;
    }
}

function renderReceipt(o) {
    $("receipt-card").innerHTML = `
        <div class="receipt-id">#${o.id}</div>
        <div class="receipt-id-label">Order Reference</div>

        <div class="receipt-items">
            ${o.items.map(it => `
                <div class="receipt-line">
                    <span class="name"><strong>${it.qty}×</strong> ${it.emoji} ${it.name}</span>
                    <span>$${it.lineTotal.toFixed(2)}</span>
                </div>
            `).join("")}
        </div>

        <div class="receipt-row"><span class="k">Subtotal</span><span class="v">$${o.subtotal.toFixed(2)}</span></div>
        <div class="receipt-row"><span class="k">Delivery</span><span class="v">${o.deliveryFee === 0 ? "FREE" : "$" + o.deliveryFee.toFixed(2)}</span></div>
        <div class="receipt-row"><span class="k">Tax</span><span class="v">$${o.tax.toFixed(2)}</span></div>
        <div class="receipt-row total"><span class="k">Total</span><span class="v">$${o.total.toFixed(2)}</span></div>

        <div style="margin-top:1.25rem;padding-top:1rem;border-top:1px dashed var(--border);">
            <div class="receipt-row"><span class="k">Name</span><span class="v">${o.name}</span></div>
            <div class="receipt-row"><span class="k">Phone</span><span class="v">${o.phone}</span></div>
            <div class="receipt-row"><span class="k">Address</span><span class="v" style="max-width:60%">${o.address}</span></div>
            ${o.notes ? `<div class="receipt-row"><span class="k">Notes</span><span class="v" style="max-width:60%;font-weight:400">${o.notes}</span></div>` : ""}
            <div class="receipt-row"><span class="k">Placed at</span><span class="v" style="font-weight:400;color:var(--text-dim)">${o.created_at}</span></div>
        </div>
    `;
}

// ============================================================
// ORDERS LIST
// ============================================================
async function showOrders() {
    try {
        const orders = await api("/api/orders");
        const grid = $("orders-grid");

        if (!orders.length) {
            grid.innerHTML = `
                <div class="empty" style="grid-column:1/-1">
                    <div class="icon">🧾</div>
                    <p>No orders yet.</p>
                    <button class="btn" style="margin-top:1rem" onclick="goHome()">Browse Menu</button>
                </div>`;
        } else {
            grid.innerHTML = orders.map(o => `
                <div class="order-card">
                    <div class="order-head">
                        <span class="order-id">#${o.id}</span>
                        <span class="status-pill">${o.status}</span>
                    </div>
                    <div class="order-meta">👤 ${o.name}</div>
                    <div class="order-meta">📍 ${o.address}</div>
                    <div class="order-meta">🕐 ${o.created_at}</div>
                    <div class="order-items-list">
                        ${o.items.map(it => `${it.qty}× ${it.emoji} ${it.name}`).join("<br>")}
                    </div>
                    <div class="order-total">$${o.total.toFixed(2)}</div>
                </div>
            `).join("");
        }
        show("view-orders");
    } catch (e) {
        toast(e.message);
    }
}

// ============================================================
// BOOT
// ============================================================
goHome();
</script>
</body>
</html>
